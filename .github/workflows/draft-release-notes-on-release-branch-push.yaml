name: Draft release notes on release branch push
on:
  create

jobs:
  draft_release_notes:
    if: true #github.event.ref_type == 'branch' # && startsWith(github.event.ref, 'bump_to_version_')
    runs-on: ubuntu-latest
    steps:
      - name: Get release version
        id: releaseVersion
        uses: actions/github-script@47f7cf65b5ced0830a325f705cad64f2f58dddf7 # 3.1.0
        with:
          result-encoding: string
          script: |
            # github.event.ref.substring('bump_to_version_'.length);
            # '${{ github.event.ref }}'
            return github.event.ref;
      - name: Get milestone for tag
        id: milestone
        uses: actions/github-script@47f7cf65b5ced0830a325f705cad64f2f58dddf7 # 3.1.0
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const milestones = await github.paginate(github.issues.listMilestones, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all'
            })

            const milestone = milestones.find(milestone => milestone.title == '${{steps.releaseVersion.outputs.result}}')

            if (milestone) {
              return milestone.number
            } else {
              return null
            }
      - name: Generate release notes text
        if: fromJSON(steps.milestone.outputs.result)
        id: generate
        uses: actions/github-script@47f7cf65b5ced0830a325f705cad64f2f58dddf7 # 3.1.0
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          result-encoding: string
          script: |
            const pullRequests = await github.paginate(github.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              base: 'master'
            })

            var draftText = "> Please categorize the following changes:\n\n"
            for (let pull of pullRequests) {
              if (pull.merged_at && pull.milestone && pull.milestone.number == ${{steps.milestone.outputs.result}}) {
                // Skip `dev/*` tags, as these represent internal changes
                if (pull.labels.length > 0 && pull.labels.every(label => label.name.startsWith("dev/"))) {
                  continue
                }

                var lineItem = "* "
                for (let label of pull.labels) {
                  lineItem += "[" + label.name.charAt(0).toUpperCase() + label.name.slice(1) + "] "
                }

                lineItem += pull.title + " #" + pull.number

                // Add author if community labeled
                if (pull.labels.some(label => label.name == "community")) {
                  lineItem += " (@" + pull.user.login + ")"
                }

                draftText += lineItem + "\n"
              }
            }
            draftText += "\n### Added\n\n### Changed\n\n### Fixed\n\n### Refactored\n\n### Removed\n\n"

            // Escape backticks
            draftText = draftText.replace(/`/g,"\\`")

            return draftText
      - name: Create release notes
        if: fromJSON(steps.milestone.outputs.result)
        # can't use actions/create-release because it doesn't like the text coming from JS
        uses: actions/github-script@47f7cf65b5ced0830a325f705cad64f2f58dddf7 # 3.1.0
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            await github.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ github.event.ref }}',
              name: '${{ steps.releaseVersion.outputs.result }}',
              draft: true,
              body: `${{ steps.generate.outputs.result }}`
            })
